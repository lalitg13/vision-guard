<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#1e1e24"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="520" rx="16" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2"/>

  <!-- Subtle Grid Accent -->
  <g stroke="#1e1e24" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="520"/>
    <line x1="350" y1="0" x2="350" y2="520"/>
    <line x1="500" y1="0" x2="500" y2="520"/>
    <line x1="650" y1="0" x2="650" y2="520"/>
    <line x1="800" y1="0" x2="800" y2="520"/>
    <line x1="950" y1="0" x2="950" y2="520"/>
  </g>

  <!-- Title & Header -->
  <text x="40" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#f4f4f5" letter-spacing="1.5">VISIONGUARD // SYSTEM ARCHITECTURE</text>
  <text x="40" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a" letter-spacing="1">END-TO-END COMPUTER VISION &amp; SECURITY TELEMETRY PIPELINE</text>
  <rect x="910" y="30" width="150" height="26" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
  <circle cx="925" cy="43" r="4" fill="#10b981"/>
  <text x="936" y="47" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">LIVE EDGE ENGINE</text>

  <!-- Column 1: Optical Ingestion -->
  <g transform="translate(40, 105)">
    <rect width="180" height="370" rx="12" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="34" rx="12" fill="#141416" stroke="#27272a" stroke-width="1"/>
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#22d3ee">01. INGESTION</text>

    <!-- Sub-boxes -->
    <rect x="14" y="55" width="152" height="74" rx="8" fill="#121214" stroke="#3f3f46" stroke-width="1"/>
    <text x="24" y="80" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f4f5">Webcam Sensor</text>
    <text x="24" y="98" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a1a1aa">cv2.VideoCapture(0)</text>
    <text x="24" y="114" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">640x480 @ 30 FPS</text>

    <rect x="14" y="145" width="152" height="74" rx="8" fill="#121214" stroke="#3f3f46" stroke-width="1"/>
    <text x="24" y="170" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f4f5">Fallback Generator</text>
    <text x="24" y="188" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a1a1aa">Offline Frame Synth</text>
    <text x="24" y="204" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f59e0b">Graceful Degrade</text>

    <rect x="14" y="235" width="152" height="110" rx="8" fill="#121214" stroke="#3f3f46" stroke-width="1"/>
    <text x="24" y="260" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f4f5">Frame Preprocessing</text>
    <text x="24" y="280" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">• BGR to Grayscale</text>
    <text x="24" y="298" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">• Histogram Equalize</text>
    <text x="24" y="316" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">• Resizing: 200x200</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 220 290 L 260 290" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4 2"/>

  <!-- Column 2: Computer Vision & Biometrics -->
  <g transform="translate(260, 105)">
    <rect width="210" height="370" rx="12" fill="url(#cardGrad)" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="34" rx="12" fill="#141416" stroke="#27272a" stroke-width="1"/>
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#06b6d4">02. VISION ENGINE</text>

    <!-- Haar Cascade -->
    <rect x="14" y="55" width="182" height="85" rx="8" fill="#121214" stroke="#3f3f46" stroke-width="1"/>
    <text x="24" y="78" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f4f5">Haar Frontal Cascade</text>
    <text x="24" y="96" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">Scale: 1.15 | MinNeighbors: 5</text>
    <text x="24" y="112" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">ROI Bounding Box Extraction</text>
    <text x="24" y="128" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22d3ee">MinSize: (80, 80)</text>

    <!-- LBPH Recognizer -->
    <rect x="14" y="152" width="182" height="110" rx="8" fill="#121214" stroke="#06b6d4" stroke-width="1"/>
    <text x="24" y="175" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f4f5">LBPH Recognizer</text>
    <text x="24" y="193" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">Radius=1, Neighbors=8</text>
    <text x="24" y="211" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">Threshold: dist &lt; 75 (Admin)</text>
    <text x="24" y="229" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ef4444">Threshold: dist &gt;= 75 (Alert)</text>
    <text x="24" y="247" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">Weights: data/trainer.yml</text>

    <!-- Biometric Enrollment -->
    <rect x="14" y="274" width="182" height="74" rx="8" fill="#121214" stroke="#3f3f46" stroke-width="1"/>
    <text x="24" y="297" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f4f5">Biometric Enrollment</text>
    <text x="24" y="315" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">20 Facial Crops @ 200x200</text>
    <text x="24" y="333" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22d3ee">Auto-Trains &amp; Saves Model</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 470 290 L 510 290" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Column 3: Telemetry & State -->
  <g transform="translate(510, 105)">
    <rect width="190" height="370" rx="12" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="34" rx="12" fill="#141416" stroke="#27272a" stroke-width="1"/>
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">03. TELEMETRY CORE</text>

    <!-- Cooldown & Rate Limit -->
    <rect x="14" y="55" width="162" height="85" rx="8" fill="#121214" stroke="#3f3f46" stroke-width="1"/>
    <text x="24" y="78" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f4f5">Cooldown Controller</text>
    <text x="24" y="96" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">6.0s Per Person Type</text>
    <text x="24" y="114" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">Anti-spam Event Filter</text>
    <text x="24" y="128" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">Thread-safe Lock</text>

    <!-- Events Storage -->
    <rect x="14" y="152" width="162" height="85" rx="8" fill="#121214" stroke="#3f3f46" stroke-width="1"/>
    <text x="24" y="175" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f4f5">Event Ledger</text>
    <text x="24" y="193" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">data/events.json</text>
    <text x="24" y="211" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">28 Rolling Seed Events</text>
    <text x="24" y="225" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22d3ee">Ring Buffer (200 Cap)</text>

    <!-- Alert Dispatcher -->
    <rect x="14" y="249" width="162" height="98" rx="8" fill="#121214" stroke="#ef4444" stroke-width="1"/>
    <text x="24" y="272" font-family="sans-serif" font-size="12" font-weight="700" fill="#ef4444">Alert Dispatcher</text>
    <text x="24" y="290" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">• Gmail SMTP SSL (465)</text>
    <text x="24" y="308" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">• SIMULATED_SMTP</text>
    <text x="24" y="326" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ef4444">• Threat Broadcast</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 700 290 L 740 290" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Column 4: Presentation & Analytics -->
  <g transform="translate(740, 105)">
    <rect width="320" height="370" rx="12" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="34" rx="12" fill="#141416" stroke="#27272a" stroke-width="1"/>
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f59e0b">04. FLASK SERVER &amp; DASHBOARD</text>

    <!-- Flask Server -->
    <rect x="14" y="55" width="292" height="90" rx="8" fill="#121214" stroke="#3f3f46" stroke-width="1"/>
    <text x="24" y="78" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f4f5">Flask Threaded Server (:5001)</text>
    <text x="24" y="96" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a1a1aa">GET /video_feed (MJPEG Stream)</text>
    <text x="24" y="112" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a1a1aa">GET /api/events | GET /api/analytics.png</text>
    <text x="24" y="128" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a1a1aa">POST /api/enroll | /api/simulate_alert</text>

    <!-- Headless Analytics -->
    <rect x="14" y="157" width="292" height="90" rx="8" fill="#121214" stroke="#3f3f46" stroke-width="1"/>
    <text x="24" y="180" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f4f5">Headless Matplotlib Engine (Agg)</text>
    <text x="24" y="198" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a1a1aa">Left: 8h Rolling Grouped Bar Chart</text>
    <text x="24" y="214" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a1a1aa">Right: 15-Point Confidence Trend Line</text>
    <text x="24" y="230" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#10b981">In-Memory PNG Buffer (Zero Leak)</text>

    <!-- Security HUD Frontend -->
    <rect x="14" y="259" width="292" height="88" rx="8" fill="#121214" stroke="#10b981" stroke-width="1"/>
    <text x="24" y="282" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f4f5">Zinc/Slate Security HUD</text>
    <text x="24" y="300" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a1a1aa">• Top Dismissible Red Threat Banner</text>
    <text x="24" y="316" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a1a1aa">• 4 KPI Telemetry Cards &amp; 2s Activity Feed</text>
    <text x="24" y="332" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#22d3ee">• 4s Analytics Refresh with Cache-Buster</text>
  </g>
</svg>
